<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven Burns Red Progress Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- パーティクル背景 -->
    <div class="particles" id="particles"></div>

    <!-- ヘッダー -->
    <header class="header">
        <h1>HEAVEN BURNS RED<br><span style="font-size: 0.6em;">PROGRESS TRACKER</span></h1>
    </header>

    <!-- タブナビゲーション -->
    <nav class="tab-container">
        <div class="tab active" data-tab="dashboard">ダッシュボード</div>
        <div class="tab" data-tab="characters">キャラクター一覧</div>
        <div class="tab" data-tab="style-catalog">スタイル図鑑</div>
        <div class="tab" data-tab="main-story">メインストーリー</div>
        <div class="tab" data-tab="events">イベント</div>
        <div class="tab" data-tab="interactions">交流・メモリー</div>
        <div class="tab" data-tab="styles">スタイル管理</div>
        <div class="tab" data-tab="badges">称号バッジ</div>
        <div class="tab" data-tab="battles">ライブ・バトル</div>
    </nav>

    <!-- メインコンテンツ -->
    <main class="main-content">
        <!-- ダッシュボード -->
        <!-- 初期値は 0% / - 。script.js の updateProgress() が起動時に実データで上書きする -->
        <div class="tab-content active" id="dashboard">
            <div class="dashboard-grid">
                <div class="progress-card">
                    <h3>🏛️ メインストーリー</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span>-</span>
                        <span>0%</span>
                    </div>
                </div>

                <div class="progress-card">
                    <h3>🎭 イベントストーリー</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span>-</span>
                        <span>0%</span>
                    </div>
                </div>

                <div class="progress-card">
                    <h3>💫 スタイルコレクション</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span>-</span>
                        <span>0%</span>
                    </div>
                </div>

                <div class="progress-card">
                    <h3>🏅 称号バッジ</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span>-</span>
                        <span>0%</span>
                    </div>
                </div>

                <div class="progress-card">
                    <h3>💖 キャラクター交流</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span>-</span>
                        <span>0%</span>
                    </div>
                </div>

                <div class="progress-card">
                    <h3>🎵 ライブモード</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span>-</span>
                        <span>0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- キャラクター一覧（data/characters.csv を元にAPI経由で取得。characters.js が描画する） -->
        <div class="tab-content" id="characters">
            <div class="char-toolbar">
                <input type="text" id="char-search" class="char-search-input" placeholder="🔍 キャラ名で検索">
                <select id="char-owned-filter" class="char-filter-select">
                    <option value="all">すべて</option>
                    <option value="complete">全スタイル所持</option>
                    <option value="partial">一部所持</option>
                    <option value="none">未所持</option>
                </select>
            </div>
            <div class="char-summary" id="char-summary"></div>
            <div class="character-grid" id="character-grid">
                <p class="loading-message">読み込み中...</p>
            </div>
        </div>

        <!-- スタイル図鑑（CSVの行=スタイル単位でカード表示。characters.js が描画する） -->
        <div class="tab-content" id="style-catalog">
            <div class="char-toolbar">
                <input type="text" id="style-search" class="char-search-input" placeholder="🔍 キャラ名・スタイル名で検索">
                <select id="style-rarity-filter" class="char-filter-select">
                    <option value="all">すべてのレア度</option>
                    <option value="SS">SS</option>
                    <option value="S">S</option>
                    <option value="A">A</option>
                </select>
                <select id="style-owned-filter" class="char-filter-select">
                    <option value="all">すべて</option>
                    <option value="owned">所持のみ</option>
                    <option value="unowned">未所持のみ</option>
                </select>
            </div>
            <div class="char-summary" id="style-summary"></div>
            <div class="style-grid" id="style-grid">
                <p class="loading-message">読み込み中...</p>
            </div>
        </div>

        <!-- 以下は script.js の generateContentFromData() が動的に生成する -->
        <div class="tab-content" id="main-story">
            <div class="checklist-section"></div>
        </div>

        <div class="tab-content" id="events"></div>

        <div class="tab-content" id="interactions"></div>

        <div class="tab-content" id="styles"></div>

        <div class="tab-content" id="badges"></div>

        <div class="tab-content" id="battles"></div>
    </main>

    <script src="script.js"></script>
    <script src="characters.js"></script>
</body>
</html>
